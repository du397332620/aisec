schemaVersion: 1.1.0
packId: example.local
description: Reviewed local rules for project-specific security invariants
rules:
  - ruleId: custom.example.local.tls-verification-disabled
    title: TLS certificate verification is explicitly disabled
    description: A project-specific transport option contains a reviewed literal that disables certificate verification.
    severity: high
    evidenceLevel: static_confirmed
    confidence: high
    cwe:
      - CWE-295
    tags:
      - tls
      - custom-policy
    remediation: Remove the bypass and use a trusted development CA for local test environments.
    files:
      extensions:
        - .js
        - .mjs
        - .cjs
        - .ts
        - .tsx
      pathPrefixes:
        - src/
      excludePathPrefixes:
        - src/fixtures/
    match:
      containsAny:
        - "rejectUnauthorized: false"
        - "NODE_TLS_REJECT_UNAUTHORIZED=0"
      excludes:
        - aisec-reviewed-near-miss
      caseSensitive: true
  - ruleId: custom.example.local.security-middleware-required
    title: Required HTTP security middleware is not visible
    description: The selected application security file lacks the reviewed middleware literal on any single line.
    severity: high
    evidenceLevel: inferred
    confidence: medium
    cwe:
      - CWE-693
    tags:
      - security-headers
      - custom-policy
    remediation: Enable the reviewed middleware in every selected application security file and add a regression test.
    files:
      extensions:
        - .js
        - .mjs
        - .cjs
        - .ts
        - .tsx
      pathPrefixes:
        - src/
      pathSuffixes:
        - security.ts
      excludePathPrefixes:
        - src/fixtures/
    match:
      containsAny:
        - "helmet("
      containsAll:
        - "app.use("
      excludes:
        - aisec-reviewed-near-miss
      caseSensitive: false
      emitWhen: absent
