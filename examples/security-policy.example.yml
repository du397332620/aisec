# Store the real policy outside the repository being scanned and replace this
# demonstration expiry with a short, reviewed organizational expiry.
schemaVersion: 1.0.0
policyId: example-release
expiresAt: 2099-12-31T23:59:59Z
profile: predeploy
requiredEngines:
  - gitleaks
  - opengrep
  - trivy
gate:
  minimumSeverity: medium
  includeInferred: false
  requireNoSuppressions: false
rules:
  required:
    - secret.stripe-live
    - secret.openai
    - dataflow.sql-injection
  block:
    - secret.stripe-live
    - secret.openai
suppressions: []
