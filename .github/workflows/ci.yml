name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Test
        run: npm test
      - name: Run bootstrap benchmark
        run: npm run benchmark
      - name: Run resource regression benchmark
        run: npm run benchmark:resources
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Verify publish contents
        run: npm pack --dry-run
      - name: Install and run the packed CLI
        run: npm run test:package
      - name: Reproduce and verify release files
        run: npm run test:release
