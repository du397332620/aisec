name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, verify and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Run release gates
        run: |
          npm test
          npm run benchmark
          npm run test:package
          npm run test:release
          npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Build and verify release files
        run: |
          npm run release:build -- --output release
          npm run release:verify -- release
      - name: Resolve the verified tarball and SBOM
        id: release-files
        shell: bash
        run: |
          tarballs=(release/*.tgz)
          sboms=(release/*.cdx.json)
          test "${#tarballs[@]}" -eq 1
          test -f "${tarballs[0]}"
          test "${#sboms[@]}" -eq 1
          test -f "${sboms[0]}"
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"
          echo "sbom=${sboms[0]}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest CycloneDX SBOM to the tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.release-files.outputs.tarball }}
          sbom-path: ${{ steps.release-files.outputs.sbom }}
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aisec-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aisec-release-${{ github.sha }}
          path: release
      - name: Recheck release digests
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "AIsec $GITHUB_REF_NAME"
